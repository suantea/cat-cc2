# Cat CC2 发行版自动构建流水线（AtomGit 流水线）
# 注意：AtomGit 只扫描 .atomgit/workflows/*.yml（不是 .github/workflows/）
# 前置：需在仓库「流水线」页面启用流水线功能，启用后做一次提交触发系统同步
# 触发：推送 v* 版本 tag（如 v2.0.0）或手动运行
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 构建 release
        run: |
          cd src-tauri
          cargo build --release

      - name: 上传发行版资产（cat-cc2.exe）
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/cat-cc2.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
