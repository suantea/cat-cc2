# Cat CC2 发行版自动构建流水线（AtomGit Actions 兼容）
# 触发：推送 v* 版本 tag（如 v2.0.0）或手动运行
# 作用：在 Windows 构建机编译 release exe 并自动上传到对应 tag 的发行版页面
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 构建 release
        run: |
          cd src-tauri
          cargo build --release

      - name: 上传发行版资产（cat-cc2.exe）
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/cat-cc2.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
