name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # WebView2 运行时在 windows-latest 预装；仅构建 exe（同发布流程.md 方式一）
      - name: Build release
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          cd src-tauri
          cargo build --release -j 2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cat-cc2-windows-x64
          path: src-tauri/target/release/cat-cc2.exe

  # macOS：arm64 与 x64 均在 macos-14（arm64 runner）上构建，x64 走交叉编译
  # （GitHub 公共 macos-13 Intel runner 已退役/排队枯竭，2026-08-14 实测 queued 30min+）
  # 无 Apple Developer 证书 → 产物未签名（ad-hoc），首次打开需右键→打开或
  # xattr -dr com.apple.quarantine 解除隔离（见使用手册 macOS 章节）
  macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build macOS bundle
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          cd src-tauri
          cargo tauri build --target ${{ matrix.target }} --bundles app,dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cat-cc2-macos-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app

  release:
    needs: [build, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
