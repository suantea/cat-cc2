name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # dist/ 前端资产已入库，cargo build 即可产出可用二进制（Tauri 内嵌资源）；
      # .app/.dmg 打包需 tauri-cli，正式发行包见 发布流程.md。
      - name: Build
        working-directory: src-tauri
        run: cargo build --release --target ${{ matrix.target }} -j 2
      - name: Rename artifact
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            SRC="src-tauri/target/${{ matrix.target }}/release/cat-cc2.exe"
            DST="CatCC2-${VERSION}-windows-x64.exe"
          else
            SRC="src-tauri/target/${{ matrix.target }}/release/cat-cc2"
            DST="CatCC2-${VERSION}-${{ matrix.target }}"
          fi
          cp "$SRC" "$DST"
          echo "ASSET=$DST" >> "$GITHUB_ENV"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
